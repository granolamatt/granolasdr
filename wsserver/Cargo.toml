[package]
name = "wsserver"
version = "0.1.0"
edition = "2021"
description = "WebSocket dict server for uhd-cuda pipeline"

[lib]
name = "wsserver"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "wsserver"
path = "src/main.rs"

[profile.release]
panic = "abort"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
