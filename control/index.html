<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>granolasdr control</title>
<style>
  body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { color: #7ec8e3; font-size: 1.2em; margin-bottom: 20px; }
  h2 { color: #aaa; font-size: 0.95em; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  /* dashboard panels */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .panels { grid-template-columns: 1fr; } }
  .panel { border: 1px solid #333; border-radius: 4px; padding: 12px; }
  /* band summary */
  #band-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  #band-table th { color: #666; font-weight: normal; text-align: left; padding: 3px 6px; border-bottom: 1px solid #333; }
  #band-table td { padding: 3px 6px; }
  .band-active { color: #98e890; }
  /* decode stream */
  #decode-list { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; font-size: 0.82em; }
  #decode-list li { border-bottom: 1px solid #222; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-snr { color: #7ec8e3; display: inline-block; width: 52px; }
  .dc-freq { color: #aaa; display: inline-block; width: 72px; }
  .dc-band { color: #666; display: inline-block; width: 36px; }
  .dc-mode-js8 { color: #e8a040; font-size: 0.85em; display: inline-block; width: 32px; }
  .dc-mode-ft8 { color: #555;    font-size: 0.85em; display: inline-block; width: 32px; }
  /* audio sinks */
  #audio-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  #audio-table th { color: #666; font-weight: normal; text-align: left; padding: 3px 6px; border-bottom: 1px solid #333; }
  #audio-table td { padding: 4px 6px; vertical-align: middle; }
  .audio-sink-id { color: #555; width: 30px; }
  .audio-current { color: #98e890; min-width: 160px; }
  .audio-input { background: #111; border: 1px solid #444; color: #e0e0e0; border-radius: 3px; padding: 2px 6px; width: 90px; font-family: monospace; font-size: 0.95em; }
  .audio-input:focus { outline: none; border-color: #7ec8e3; }
  .audio-select { background: #111; border: 1px solid #444; color: #e0e0e0; border-radius: 3px; padding: 2px 4px; font-family: monospace; font-size: 0.88em; }
  .audio-btn { background: #222; border: 1px solid #444; color: #7ec8e3; border-radius: 3px; padding: 2px 10px; cursor: pointer; font-family: monospace; font-size: 0.85em; }
  .audio-btn:hover { background: #2a3a4a; border-color: #7ec8e3; }
  .audio-btn:active { background: #1a2a3a; }
  .audio-zmq { color: #444; font-size: 0.8em; }
  /* status bar */
  .status-bar { font-size: 0.75em; color: #555; margin-top: 16px; display: flex; gap: 20px; }
  #sse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 4px; }
  #sse-dot.on { background: #98e890; }
</style>
</head>
<body>
<h1>granolasdr</h1>

<div class="panels">
  <!-- decode stream -->
  <div class="panel">
    <h2>decode stream <span style="color:#555;font-size:0.8em">(newest first — persists across refresh)</span></h2>
    <ul id="decode-list"></ul>
  </div>

  <!-- per-band summary (15-min window) -->
  <div class="panel">
    <h2>bands — 15 min window</h2>
    <table id="band-table">
      <thead><tr><th>band</th><th>stations</th><th>best SNR</th></tr></thead>
      <tbody id="band-tbody"></tbody>
    </table>
  </div>
</div>

<!-- audio sinks -->
<h2>audio channels</h2>
<div class="panel">
  <table id="audio-table">
    <thead><tr><th>sink</th><th>current</th><th>freq MHz</th><th>preset</th><th></th><th class="audio-zmq">zmq port</th></tr></thead>
    <tbody id="audio-tbody"></tbody>
  </table>
</div>

<!-- wideband waterfall -->
<h2>waterfall — <span id="wf-title">HF bands composite (160m–6m packed)</span></h2>
<div id="wf-mode" style="margin-bottom:6px;font-size:0.88em;">
  <label style="margin-right:14px;cursor:pointer;"><input type="radio" name="wfmode" value="ft8" checked onchange="setWfMode('ft8')"> FT8 / JS8</label>
  <label style="cursor:pointer;"><input type="radio" name="wfmode" value="cw" onchange="setWfMode('cw')"> CW</label>
</div>
<div style="position:relative;display:block;">
  <canvas id="waterfall" width="2048" height="1200" style="width:100%;image-rendering:pixelated;display:block;border:1px solid #333;"></canvas>
  <div id="wf-separators" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
</div>
<div id="wf-bands" style="position:relative;height:16px;font-size:0.7em;color:#666;margin-bottom:4px;"></div>

<div class="status-bar">
  <span><span id="sse-dot"></span>WS bus <span id="sse-status">disconnected</span></span>
</div>

<script>
// Band mapping: [min_hz, max_hz, name]
const BANDS = [
  [1800000,  2000000, '160m'],
  [3500000,  4000000,  '80m'],
  [5330000,  5410000,  '60m'],
  [7000000,  7300000,  '40m'],
  [10100000, 10150000, '30m'],
  [14000000, 14350000, '20m'],
  [18068000, 18168000, '17m'],
  [21000000, 21450000, '15m'],
  [24890000, 24990000, '12m'],
  [28000000, 29700000, '10m'],
  [50000000, 54000000,  '6m'],
];
function freqToBand(hz) {
  for (const [lo, hi, name] of BANDS) if (hz >= lo && hz <= hi) return name;
  return '?';
}

// Per-callsign map kept in sync with wsdict server-side expiring keys.
// One entry per callsign (wsdict key → decode object); TTL=900s on server.
// On reconnect the server pushes all live keys, so stats survive page refresh.
const heardMap = new Map();
let initialLoadDone = false;
let initialLoadTimer = null;

function renderBandTable() {
  const bandData = new Map();
  for (const val of heardMap.values()) {
    const band = freqToBand(val.freq);
    const cur = bandData.get(band) || { count: 0, bestSnr: -99 };
    cur.count++;
    if (val.snr > cur.bestSnr) cur.bestSnr = val.snr;
    bandData.set(band, cur);
  }
  const tbody = document.getElementById('band-tbody');
  const sorted = [...bandData.entries()].sort((a, b) => b[1].count - a[1].count);
  tbody.innerHTML = sorted.map(([band, {count, bestSnr}]) =>
    `<tr><td class="band-active">${band}</td><td>${count}</td><td>${bestSnr > -99 ? bestSnr.toFixed(1) : '—'}</td></tr>`
  ).join('') || '<tr><td colspan="3" style="color:#555">no decodes this window</td></tr>';
}

// Called 500ms after subscribe to flush the initial server-push batch into the
// decode list (sorted by time so newest ends up at top after prependDecode calls).
function finishInitialLoad() {
  initialLoadDone = true;
  const entries = [...heardMap.values()].sort((a, b) => a.unix - b.unix);
  for (const val of entries.slice(-200)) {
    prependDecode(val, freqToBand(val.freq));
  }
}

function addHeard(key, val) {
  heardMap.set(key, val);
  renderBandTable();
  if (initialLoadDone) prependDecode(val, freqToBand(val.freq));
}

function prependDecode(ev, band) {
  const ul = document.getElementById('decode-list');
  const snrStr = (ev.snr >= 0 ? '+' : '') + ev.snr.toFixed(1);
  const freqStr = (ev.freq / 1e6).toFixed(4);
  const t = new Date(ev.unix * 1000).toISOString().substr(11, 8);
  const isJs8 = ev.mode && ev.mode.startsWith('JS8');
  const modeHtml = isJs8
    ? `<span class="dc-mode-js8">JS8</span>`
    : `<span class="dc-mode-ft8">FT8</span>`;
  const callStyle = isJs8 ? ' style="color:#e8a040"' : '';
  const li = document.createElement('li');
  li.innerHTML = `${modeHtml}<span class="dc-snr">${snrStr} dB</span><span class="dc-freq">${freqStr} MHz</span><span class="dc-band">${band}</span> <span${callStyle}>${escHtml(ev.call)}</span> <span style="color:#555">${t}</span>`;
  ul.insertBefore(li, ul.firstChild);
  while (ul.children.length > 200) ul.removeChild(ul.lastChild);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Audio sink control ────────────────────────────────────────────────────────
const AUDIO_PRESETS = [
  {name:'160m', freq_hz:1840000},
  {name:'80m',  freq_hz:3573000},
  {name:'60m',  freq_hz:5357000},
  {name:'40m',  freq_hz:7074000},
  {name:'30m',  freq_hz:10136000},
  {name:'20m',  freq_hz:14074000},
  {name:'17m',  freq_hz:18100000},
  {name:'15m',  freq_hz:21074000},
  {name:'12m',  freq_hz:24915000},
  {name:'10m',  freq_hz:28074000},
  {name:'6m',   freq_hz:50313000},
];
let wsConn = null;  // set in connectBus(); used by tuneAudioSink

function onAudioPresetChange(sink) {
  const sel = document.getElementById(`audio-preset-${sink}`);
  const inp = document.getElementById(`audio-freq-${sink}`);
  const preset = AUDIO_PRESETS.find(p => p.name === sel.value);
  if (preset) inp.value = (preset.freq_hz / 1e6).toFixed(4);
}

function tuneAudioSink(sink) {
  if (!wsConn || wsConn.readyState !== WebSocket.OPEN) return;
  const inp = document.getElementById(`audio-freq-${sink}`);
  const sel = document.getElementById(`audio-preset-${sink}`);
  const freq_hz = Math.round(parseFloat(inp.value) * 1e6);
  if (!freq_hz || freq_hz < 500000 || freq_hz > 70000000) return;
  const label = sel.value ? `${sel.value} FT8` : `${inp.value} MHz`;
  wsConn.send(JSON.stringify({type:'set', key:'granolasdr:audio:cmd', value:{sink, freq_hz, label}}));
  sel.value = '';
}

function updateAudioSinkDisplay(s) {
  const lbl = document.getElementById(`audio-lbl-${s.id}`);
  const inp = document.getElementById(`audio-freq-${s.id}`);
  if (lbl) lbl.textContent = `${s.label} · ${(s.freq_hz/1e6).toFixed(4)} MHz`;
  if (inp && document.activeElement !== inp)
    inp.value = (s.freq_hz / 1e6).toFixed(4);
}

function buildAudioTable() {
  const presetOpts = ['<option value="">— preset —</option>',
    ...AUDIO_PRESETS.map(p => `<option value="${escHtml(p.name)}">${escHtml(p.name)}</option>`)
  ].join('');
  document.getElementById('audio-tbody').innerHTML = [0,1,2,3].map(i =>
    `<tr>
      <td class="audio-sink-id">${i}</td>
      <td id="audio-lbl-${i}" class="audio-current">—</td>
      <td><input id="audio-freq-${i}" class="audio-input" type="number" step="0.001" min="0.5" max="70" placeholder="MHz"></td>
      <td><select id="audio-preset-${i}" class="audio-select" onchange="onAudioPresetChange(${i})">${presetOpts}</select></td>
      <td><button class="audio-btn" onclick="tuneAudioSink(${i})">tune</button></td>
      <td class="audio-zmq">${5581 + i}</td>
    </tr>`
  ).join('');
}

// wsdict WebSocket connection (wsdict server built into hf_rx, port 8765)
// Subscribe with a glob pattern — covers waterfall, decode, timing, and any future keys.
// Keys use colon separators (granolasdr:ft8:decode, granolasdr:waterfall:0, etc.)
// granolasdr:* matches all of them since none contain forward slashes.
const SUBSCRIBE_PATTERN = 'granolasdr:*';

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function connectBus() {
  const dot = document.getElementById('sse-dot');
  const status = document.getElementById('sse-status');
  const host = location.hostname || 'localhost';
  const ws = new WebSocket(`ws://${host}:8765/ws`);
  wsConn = ws;
  ws.onopen = () => {
    dot.className = 'on'; status.textContent = 'connected';
    heardMap.clear();
    initialLoadDone = false;
    if (initialLoadTimer) clearTimeout(initialLoadTimer);
    // Give the server 500ms to push all current heard keys before treating
    // further updates as live decodes (which also get added to the decode list).
    initialLoadTimer = setTimeout(finishInitialLoad, 500);
    ws.send(JSON.stringify({type: 'subscribe', keys: [SUBSCRIBE_PATTERN]}));
  };
  ws.onerror = () => { dot.className = ''; status.textContent = 'error'; };
  ws.onclose = () => {
    wsConn = null;
    dot.className = ''; status.textContent = 'reconnecting…';
    setTimeout(connectBus, 3000);
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch(_) { return; }
    const {type, key, value: val} = msg;

    if (type === 'key_expired') {
      if (key && key.includes(':heard:')) {
        heardMap.delete(key);
        renderBandTable();
      }
      return;
    }

    if (type !== 'update') return;

    if (key.startsWith('granolasdr:audio:status:')) {
      if (val && typeof val === 'object' && typeof val.id === 'number')
        updateAudioSinkDisplay(val);
      return;
    }

    if (key.startsWith(WF_KEY[wfMode])) {
      // Only the active mode's waterfall family feeds the canvas.
      const rgba = b64ToBytes(val);
      if (!wfDebugDone && rgba.length > 0) {
        wfDebugDone = true;
        const rows = Math.round(rgba.length / (WF_OUT_BINS * 4));
        console.log(`[Waterfall:${wfMode}] first batch: len=${rgba.length} rows=${rows} (${WF_OUT_BINS}px × 4 RGBA)`);
      }
      requestAnimationFrame(() => appendWaterfallBatch(rgba));
    } else if (key.startsWith('granolasdr:waterfall:') || key.startsWith('granolasdr:cwwaterfall:')) {
      // Inactive waterfall family (other mode) — ignore until selected.
    } else if (key.includes(':heard:')) {
      if (val && typeof val === 'object') addHeard(key, val);
    }
  };
}


// Waterfall: scrolling canvas, 2048 pixels wide, newest row at bottom.
// X-axis is composite frequency (HFChannelizer packs HF bands back-to-back).
// Total composite content: 0–218 kHz (2180 wideband bins × 100 Hz), the packed
// span of all kHFBands.  Matches default --waterfall-bw-hz (kCompositeContentHz).
const WF_OUT_BINS = 2048;

// Composite frequency layout derived from hf_bands.h kHFBands[].bw * 100 Hz.
// Each band occupies bw*100 Hz in the packed composite (0–218 kHz total).
// Must stay in lockstep with kHFBands (all 12 bands, back-to-back).
// [composite_start_hz, composite_end_hz, label]
const WF_COMPOSITE_BANDS = [
  [      0,   7000, '160m'],  // bw=70
  [   7000,  17000,  '80m'],  // bw=100
  [  17000,  35000,  '60m'],  // bw=180
  [  35000,  49000,  '40m'],  // bw=140
  [  49000,  56000, '40m-2'], // bw=70
  [  56000,  69000,  '30m'],  // bw=130
  [  69000,  99000,  '20m'],  // bw=300
  [  99000, 142000,  '17m'],  // bw=430
  [ 142000, 165000,  '15m'],  // bw=230
  [ 165000, 182000,  '12m'],  // bw=170
  [ 182000, 209000,  '10m'],  // bw=270
  [ 209000, 218000,   '6m'],  // bw=90
];
const WF_TOTAL_COMPOSITE_HZ = 218000;

// CW composite layout: the 9 CW sub-bands (gm/hf/cw_bands.h) packed back-to-back,
// in 100 Hz composite-bin units (Σ bw = 4700).  The CW waterfall renders these bins.
// [composite_bin_start, composite_bin_end, label]
const WF_CW_BANDS = [
  [   0,  400, '160m'],  // bw=400  1.800–1.840
  [ 400, 1000,  '80m'],  // bw=600  3.500–3.560
  [1000, 1500,  '40m'],  // bw=500  7.000–7.050
  [1500, 1800,  '30m'],  // bw=300  10.100–10.130
  [1800, 2500,  '20m'],  // bw=700  14.000–14.070
  [2500, 2800,  '17m'],  // bw=300  18.068–18.098
  [2800, 3700,  '15m'],  // bw=900  21.000–21.090
  [3700, 4000,  '12m'],  // bw=300  24.890–24.920
  [4000, 4700,  '10m'],  // bw=700  28.000–28.070
];
const WF_TOTAL_CW = 4700;

// Waterfall display mode: 'ft8' (FT8/JS8 composite) or 'cw' (CW composite).
let wfMode = 'ft8';

// Which wsdict waterfall key family feeds the canvas in each mode.
const WF_KEY = { ft8: 'granolasdr:waterfall:', cw: 'granolasdr:cwwaterfall:' };
const WF_TITLE = {
  ft8: 'HF bands composite (160m–6m packed)',
  cw:  'CW composite (819.2 kHz, 9 CW sub-bands, 160m–10m)',
};

function activeWfLayout() {
  return wfMode === 'cw'
    ? { bands: WF_CW_BANDS,        total: WF_TOTAL_CW }
    : { bands: WF_COMPOSITE_BANDS, total: WF_TOTAL_COMPOSITE_HZ };
}

function renderWfBandLabels() {
  const { bands, total } = activeWfLayout();
  const div = document.getElementById('wf-bands');
  const spans = bands.map(([start, end, name]) => {
    const centerPx = (start + end) / 2 / total * WF_OUT_BINS;
    const pct      = (centerPx / (WF_OUT_BINS - 1) * 100).toFixed(2);
    return `<span style="position:absolute;left:${pct}%;transform:translateX(-50%);color:#7ec8e3">${name}</span>`;
  });
  div.innerHTML = spans.join('');

  // Vertical separator lines at each band boundary.
  const sep = document.getElementById('wf-separators');
  sep.innerHTML = bands.slice(1).map(([start]) => {
    const pct = (start / total * 100).toFixed(2);
    return `<div style="position:absolute;top:0;bottom:0;left:${pct}%;width:1px;background:rgba(120,120,180,0.45);"></div>`;
  }).join('');
}

// Switch waterfall source: relabel bands, retitle, and clear the canvas so the two
// composites' rows never intermix on screen.
function setWfMode(mode) {
  if (mode !== 'ft8' && mode !== 'cw') return;
  wfMode = mode;
  document.getElementById('wf-title').textContent = WF_TITLE[mode];
  renderWfBandLabels();
  if (wfCtx) { wfCtx.fillStyle = '#000'; wfCtx.fillRect(0, 0, wfCanvas.width, wfCanvas.height); }
}

let wfCanvas, wfCtx, wfDebugDone = false;

function initWaterfall() {
  wfCanvas = document.getElementById('waterfall');
  wfCtx = wfCanvas.getContext('2d', { willReadFrequently: true });
  renderWfBandLabels();
}

// Receive a pre-colored RGBA batch: rows × WF_OUT_BINS × 4 bytes.
// Rows are in chronological order (row 0 = oldest, row N-1 = newest).
// Scroll the canvas up by `rows` and paste the new rows at the bottom.
//
// Scrolling is done with a canvas self-blit (drawImage) rather than
// getImageData/putImageData of the whole canvas.  The old approach allocated a
// fresh ~10 MB ImageData every batch (~80 MB/s), whose GC pauses froze the
// scroll every few seconds (the "blank every ~3s").  Here the only per-batch
// allocation is a reused strip for the new rows.
let wfRowImg = null;
function appendWaterfallBatch(rgba) {
  const h    = wfCanvas.height;
  const w    = wfCanvas.width;
  const rows = Math.round(rgba.length / (WF_OUT_BINS * 4));
  if (rows < 1) return;

  // Scroll existing content up by `rows` lines (GPU/CPU blit, no JS allocation).
  wfCtx.drawImage(wfCanvas, 0, rows, w, h - rows, 0, 0, w, h - rows);

  // Paint just the new rows at the bottom via a reused strip ImageData.
  if (!wfRowImg || wfRowImg.height !== rows) wfRowImg = wfCtx.createImageData(w, rows);
  const d = wfRowImg.data;
  for (let row = 0; row < rows; row++) {
    const dstBase = row * w * 4;
    const srcBase = row * WF_OUT_BINS * 4;
    for (let col = 0; col < w && col < WF_OUT_BINS; col++) {
      d[dstBase + col*4+0] = rgba[srcBase + col*4+0];
      d[dstBase + col*4+1] = rgba[srcBase + col*4+1];
      d[dstBase + col*4+2] = rgba[srcBase + col*4+2];
      d[dstBase + col*4+3] = 255;
    }
  }
  wfCtx.putImageData(wfRowImg, 0, h - rows);
}

function init() {
  initWaterfall();
  buildAudioTable();
  connectBus();
}
init();
</script>
</body>
</html>
