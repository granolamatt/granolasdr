<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>granolasdr control</title>
<style>
  body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { color: #7ec8e3; font-size: 1.2em; margin-bottom: 20px; }
  h2 { color: #aaa; font-size: 0.95em; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  /* sinks */
  .sink { border: 1px solid #333; border-radius: 4px; padding: 14px; margin-bottom: 10px; }
  .sink-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .sink-id { color: #7ec8e3; font-weight: bold; min-width: 50px; }
  .sink-label { color: #aaa; font-size: 0.9em; flex: 1; }
  .sink-freq { color: #98e890; font-size: 1.1em; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=number] { background: #2a2a2a; color: #e0e0e0; border: 1px solid #555; border-radius: 3px; padding: 5px 8px; width: 120px; font-family: monospace; }
  select { background: #2a2a2a; color: #e0e0e0; border: 1px solid #555; border-radius: 3px; padding: 5px 8px; font-family: monospace; }
  button { background: #2a4a5a; color: #e0e0e0; border: 1px solid #7ec8e3; border-radius: 3px; padding: 5px 12px; cursor: pointer; font-family: monospace; }
  button:hover { background: #3a6a8a; }
  .error { color: #e87070; font-size: 0.85em; margin-top: 4px; }
  /* dashboard panels */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .panels { grid-template-columns: 1fr; } }
  .panel { border: 1px solid #333; border-radius: 4px; padding: 12px; }
  /* GPU timing */
  .timing-row { display: flex; gap: 20px; }
  .timing-val { font-size: 1.4em; color: #98e890; }
  .timing-lbl { font-size: 0.75em; color: #666; }
  /* band summary */
  #band-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  #band-table th { color: #666; font-weight: normal; text-align: left; padding: 3px 6px; border-bottom: 1px solid #333; }
  #band-table td { padding: 3px 6px; }
  .band-active { color: #98e890; }
  /* decode stream */
  #decode-list { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; font-size: 0.82em; }
  #decode-list li { border-bottom: 1px solid #222; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-snr { color: #7ec8e3; display: inline-block; width: 52px; }
  .dc-freq { color: #aaa; display: inline-block; width: 72px; }
  .dc-band { color: #666; display: inline-block; width: 36px; }
  .dc-mode-js8 { color: #e8a040; font-size: 0.85em; display: inline-block; width: 32px; }
  .dc-mode-ft8 { color: #555;    font-size: 0.85em; display: inline-block; width: 32px; }
  /* JS8 timing row */
  .timing-row-label { font-size: 0.75em; color: #555; margin-top: 10px; margin-bottom: 4px; }
  .timing-val-sm { font-size: 1.1em; color: #c8a060; }
  .timing-lbl-sm { font-size: 0.7em; color: #555; }
  /* status bar */
  .status-bar { font-size: 0.75em; color: #555; margin-top: 16px; display: flex; gap: 20px; }
  #sse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 4px; }
  #sse-dot.on { background: #98e890; }
</style>
</head>
<body>
<h1>granolasdr</h1>

<div class="panels">
  <!-- GPU timing -->
  <div class="panel">
    <h2>GPU timing</h2>
    <div class="timing-row-label">FT8</div>
    <div class="timing-row">
      <div>
        <div class="timing-val" id="t-scan">—</div>
        <div class="timing-lbl">scan ms</div>
      </div>
      <div>
        <div class="timing-val" id="t-ldpc">—</div>
        <div class="timing-lbl">ldpc ms</div>
      </div>
      <div>
        <div class="timing-val" id="t-cands">—</div>
        <div class="timing-lbl">candidates</div>
      </div>
    </div>
    <div class="timing-row-label" id="js8-timing-row" style="display:none">JS8</div>
    <div class="timing-row" id="js8-timing-vals" style="display:none">
      <div>
        <div class="timing-val-sm" id="t-js8-scan">—</div>
        <div class="timing-lbl-sm">scan ms</div>
      </div>
      <div>
        <div class="timing-val-sm" id="t-js8-cands">—</div>
        <div class="timing-lbl-sm">candidates</div>
      </div>
    </div>
  </div>

  <!-- per-band summary (15-min window) -->
  <div class="panel">
    <h2>bands — 15 min window</h2>
    <table id="band-table">
      <thead><tr><th>band</th><th>decodes</th><th>best SNR</th></tr></thead>
      <tbody id="band-tbody"></tbody>
    </table>
  </div>
</div>

<!-- decode stream -->
<h2>decode stream <span style="color:#555;font-size:0.8em">(newest first, last 200)</span></h2>
<ul id="decode-list"></ul>

<!-- wideband waterfall -->
<h2>waterfall — HF bands composite (160m–10m packed)</h2>
<canvas id="waterfall" width="2048" height="1200" style="width:100%;image-rendering:pixelated;display:block;border:1px solid #333;"></canvas>
<div id="wf-bands" style="position:relative;height:16px;font-size:0.7em;color:#666;margin-bottom:4px;"></div>

<!-- tunable sinks -->
<h2>tunable sinks</h2>
<div id="sinks"></div>

<div class="status-bar">
  <span><span id="sse-dot"></span>WS bus <span id="sse-status">disconnected</span></span>
  <span>last poll: <span id="status-bar">—</span></span>
</div>

<script>
// Band mapping: [min_hz, max_hz, name]
const BANDS = [
  [1800000,  2000000, '160m'],
  [3500000,  4000000,  '80m'],
  [5330000,  5410000,  '60m'],
  [7000000,  7300000,  '40m'],
  [10100000, 10150000, '30m'],
  [14000000, 14350000, '20m'],
  [18068000, 18168000, '17m'],
  [21000000, 21450000, '15m'],
  [24890000, 24990000, '12m'],
  [28000000, 29700000, '10m'],
  [50000000, 54000000,  '6m'],
];
function freqToBand(hz) {
  for (const [lo, hi, name] of BANDS) if (hz >= lo && hz <= hi) return name;
  return '?';
}

// Per-band accumulator for current 15-min window.
const bandMap = new Map(); // name → {count, bestSnr}
let windowStart = 0;

function windowBoundary(unix) {
  return Math.floor(unix / 900) * 900;
}

function maybeResetWindow(unix) {
  const wb = windowBoundary(unix);
  if (windowStart === 0) windowStart = wb;
  if (wb > windowStart) { bandMap.clear(); windowStart = wb; }
}

// Dedup: same callsign + freq-bin + 15-s epoch = duplicate from cont/epoch overlap.
const seenDecodes = new Map(); // key → expiry unix
function isDuplicate(ev) {
  const bin = Math.round(ev.freq / 6.25);
  const epoch = Math.floor(ev.unix / 15);
  const key = `${ev.call}|${bin}|${epoch}`;
  const now = Date.now() / 1000;
  if (seenDecodes.has(key) && seenDecodes.get(key) > now) return true;
  seenDecodes.set(key, now + 30); // expire after 30 s
  // Prune old entries periodically to avoid unbounded growth.
  if (seenDecodes.size > 500) {
    for (const [k, exp] of seenDecodes) if (exp <= now) seenDecodes.delete(k);
  }
  return false;
}

function addDecode(ev) {
  if (isDuplicate(ev)) return;
  maybeResetWindow(ev.unix);
  const band = freqToBand(ev.freq);
  const cur = bandMap.get(band) || { count: 0, bestSnr: -99 };
  cur.count++;
  if (ev.snr > cur.bestSnr) cur.bestSnr = ev.snr;
  bandMap.set(band, cur);
  renderBandTable();
  prependDecode(ev, band);
}

function renderBandTable() {
  const tbody = document.getElementById('band-tbody');
  const sorted = [...bandMap.entries()].sort((a, b) => b[1].count - a[1].count);
  tbody.innerHTML = sorted.map(([band, {count, bestSnr}]) =>
    `<tr><td class="band-active">${band}</td><td>${count}</td><td>${bestSnr > -99 ? bestSnr.toFixed(1) : '—'}</td></tr>`
  ).join('') || '<tr><td colspan="3" style="color:#555">no decodes this window</td></tr>';
}

function prependDecode(ev, band) {
  const ul = document.getElementById('decode-list');
  const snrStr = (ev.snr >= 0 ? '+' : '') + ev.snr.toFixed(1);
  const freqStr = (ev.freq / 1e6).toFixed(4);
  const t = new Date(ev.unix * 1000).toISOString().substr(11, 8);
  const isJs8 = ev.mode === 'JS8';
  const modeHtml = isJs8
    ? `<span class="dc-mode-js8">JS8</span>`
    : `<span class="dc-mode-ft8">FT8</span>`;
  const callStyle = isJs8 ? ' style="color:#e8a040"' : '';
  const li = document.createElement('li');
  li.innerHTML = `${modeHtml}<span class="dc-snr">${snrStr} dB</span><span class="dc-freq">${freqStr} MHz</span><span class="dc-band">${band}</span> <span${callStyle}>${escHtml(ev.call)}</span> <span style="color:#555">${t}</span>`;
  ul.insertBefore(li, ul.firstChild);
  while (ul.children.length > 200) ul.removeChild(ul.lastChild);
}

function updateTiming(ev) {
  document.getElementById('t-scan').textContent = ev.scan_ms.toFixed(1);
  document.getElementById('t-ldpc').textContent = ev.ldpc_ms.toFixed(1);
  document.getElementById('t-cands').textContent = ev.n;
}

function updateJS8Timing(ev) {
  document.getElementById('js8-timing-row').style.display = '';
  document.getElementById('js8-timing-vals').style.display = '';
  document.getElementById('t-js8-scan').textContent = ev.scan_ms.toFixed(1);
  document.getElementById('t-js8-cands').textContent = ev.n;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// wsdict WebSocket connection (wsdict server built into hf_rx, port 8765)
const WF_KEYS = Array.from({length: 8}, (_, i) => `granolasdr:waterfall:${i}`);
const SUBSCRIBE_KEYS = [
  ...WF_KEYS,
  'granolasdr:ft8:decode',
  'granolasdr:js8:decode',
  'granolasdr:ft8:timing',
  'granolasdr:js8:timing',
];

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function connectBus() {
  const dot = document.getElementById('sse-dot');
  const status = document.getElementById('sse-status');
  const host = location.hostname || 'localhost';
  const ws = new WebSocket(`ws://${host}:8765/ws`);
  ws.onopen = () => {
    dot.className = 'on'; status.textContent = 'connected';
    ws.send(JSON.stringify({type: 'subscribe', keys: SUBSCRIBE_KEYS}));
  };
  ws.onerror = () => { dot.className = ''; status.textContent = 'error'; };
  ws.onclose = () => {
    dot.className = ''; status.textContent = 'reconnecting…';
    setTimeout(connectBus, 3000);
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch(_) { return; }
    if (msg.type !== 'update') return;
    const key = msg.key;
    const val = msg.value;
    if (WF_KEYS.includes(key)) {
      const rgba = b64ToBytes(val);
      if (!wfDebugDone && rgba.length > 0) {
        wfDebugDone = true;
        const rows = Math.round(rgba.length / (WF_OUT_BINS * 4));
        console.log(`[Waterfall] first batch: len=${rgba.length} rows=${rows} (${WF_OUT_BINS}px × 4 RGBA)`);
      }
      requestAnimationFrame(() => appendWaterfallBatch(rgba));
    } else if (key === 'granolasdr:ft8:decode' || key === 'granolasdr:js8:decode') {
      if (val && typeof val === 'object') addDecode(val);
    } else if (key === 'granolasdr:ft8:timing') {
      if (val && typeof val === 'object') updateTiming(val);
    } else if (key === 'granolasdr:js8:timing') {
      if (val && typeof val === 'object') updateJS8Timing(val);
    }
  };
}

// Tunable sinks (existing REST poll)
const PRESETS = [];
async function loadPresets() {
  try {
    const r = await fetch('/api/presets');
    if (r.ok) {
      const d = await r.json();
      PRESETS.splice(0, Infinity, ...d.presets);
    }
  } catch(e) {}
}
function sinkHtml(s) {
  const opts = PRESETS.map(p =>
    `<option value="${p.freq_hz}">${p.name} (${(p.freq_hz/1e6).toFixed(4)} MHz)</option>`
  ).join('');
  return `
  <div class="sink" id="sink-${s.id}">
    <div class="sink-header">
      <span class="sink-id">Sink ${s.id}</span>
      <span class="sink-label" id="label-${s.id}">${escHtml(s.label)}</span>
      <span class="sink-freq" id="freq-${s.id}">${(s.freq_hz/1e6).toFixed(4)} MHz</span>
    </div>
    <div class="controls">
      <input type="number" id="hz-${s.id}" value="${s.freq_hz}" step="100" min="0" max="69952000">
      <button onclick="tuneHz(${s.id})">Tune</button>
      <select id="preset-${s.id}"><option value="">— preset —</option>${opts}</select>
      <button onclick="tunePreset(${s.id})">Apply</button>
    </div>
    <div class="error" id="err-${s.id}"></div>
  </div>`;
}
async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) return;
    const d = await r.json();
    const container = document.getElementById('sinks');
    for (const s of d.sinks) {
      const existing = document.getElementById(`sink-${s.id}`);
      if (!existing) { container.insertAdjacentHTML('beforeend', sinkHtml(s)); }
      else {
        document.getElementById(`label-${s.id}`).textContent = s.label;
        document.getElementById(`freq-${s.id}`).textContent = (s.freq_hz/1e6).toFixed(4) + ' MHz';
        const inp = document.getElementById(`hz-${s.id}`);
        if (document.activeElement !== inp) inp.value = s.freq_hz;
      }
    }
    document.getElementById('status-bar').textContent = new Date().toLocaleTimeString();
  } catch(e) { /* /api/status not available in wsdict-only mode */ }
}
async function tuneHz(id) {
  const hz = parseInt(document.getElementById(`hz-${id}`).value, 10);
  if (!isNaN(hz)) await doTune(id, hz, null);
}
async function tunePreset(id) {
  const sel = document.getElementById(`preset-${id}`);
  const hz = parseInt(sel.value, 10);
  if (!isNaN(hz) && sel.value) await doTune(id, hz, sel.options[sel.selectedIndex].text.split(' ')[0] + ' FT8');
}
async function doTune(id, freq_hz, label) {
  const errEl = document.getElementById(`err-${id}`);
  errEl.textContent = '';
  const body = { sink: id, freq_hz };
  if (label) body.label = label;
  try {
    const r = await fetch('/api/tune', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) errEl.textContent = d.error || 'error'; else refreshStatus();
  } catch(e) { errEl.textContent = e.message; }
}

// Waterfall: scrolling canvas, 2048 pixels wide, newest row at bottom.
// X-axis is composite frequency (HFChannelizer packs HF bands back-to-back).
// Total composite content: 0–3.83 MHz (38300 bands × 100 Hz/bin).
// Matches default --waterfall-center-hz / --waterfall-bw-hz in hf_rx.
const WF_OUT_BINS = 2048;

// Composite frequency layout from hf_bands.h — each entry:
// [composite_start_hz, composite_end_hz, label]
// Cumulative offsets from sum of bw * 100 for each band.
const WF_COMPOSITE_BANDS = [
  [       0,   200000, '160m'],
  [  200000,   700000,  '80m'],
  [  700000,   780000,  '60m'],
  [  780000,  1080000,  '40m'],
  [ 1080000,  1130000,  '30m'],
  [ 1130000,  1480000,  '20m'],
  [ 1480000,  1580000,  '17m'],
  [ 1580000,  2030000,  '15m'],
  [ 2030000,  2130000,  '12m'],
  [ 2130000,  3830000,  '10m'],
];
const WF_TOTAL_COMPOSITE_HZ = 3830000;

function renderWfBandLabels() {
  const div = document.getElementById('wf-bands');
  const spans = WF_COMPOSITE_BANDS.map(([start, end, name]) => {
    const centerPx  = (start + end) / 2 / WF_TOTAL_COMPOSITE_HZ * WF_OUT_BINS;
    const pct       = (centerPx / (WF_OUT_BINS - 1) * 100).toFixed(2);
    return `<span style="position:absolute;left:${pct}%;transform:translateX(-50%);color:#7ec8e3">${name}</span>`;
  });
  div.innerHTML = spans.join('');
}

let wfCanvas, wfCtx, wfDebugDone = false;

function initWaterfall() {
  wfCanvas = document.getElementById('waterfall');
  wfCtx = wfCanvas.getContext('2d', { willReadFrequently: true });
  renderWfBandLabels();
}

// Receive a pre-colored RGBA batch: rows × WF_OUT_BINS × 4 bytes.
// Rows are in chronological order (row 0 = oldest, row N-1 = newest).
// Scroll the canvas up by `rows` and paste the new rows at the bottom.
function appendWaterfallBatch(rgba) {
  const h    = wfCanvas.height;
  const w    = wfCanvas.width;
  const rows = Math.round(rgba.length / (WF_OUT_BINS * 4));
  if (rows < 1) return;

  const frame = wfCtx.getImageData(0, 0, w, h);
  // Scroll existing content up by `rows` lines.
  frame.data.copyWithin(0, rows * w * 4, w * 4 * h);
  // Paint new rows at the bottom (row 0 = canvas row h-rows, row N-1 = h-1).
  for (let row = 0; row < rows; row++) {
    const canvasBase = (h - rows + row) * w * 4;
    const srcBase    = row * WF_OUT_BINS * 4;
    for (let col = 0; col < w && col < WF_OUT_BINS; col++) {
      frame.data[canvasBase + col*4+0] = rgba[srcBase + col*4+0];
      frame.data[canvasBase + col*4+1] = rgba[srcBase + col*4+1];
      frame.data[canvasBase + col*4+2] = rgba[srcBase + col*4+2];
      frame.data[canvasBase + col*4+3] = 255;
    }
  }
  wfCtx.putImageData(frame, 0, 0);
}

async function init() {
  await loadPresets();
  await refreshStatus();
  setInterval(refreshStatus, 2000);
  initWaterfall();
  connectBus();
}
init();
</script>
</body>
</html>
